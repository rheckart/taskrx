[package]
name = "taskrx-desktop-core"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "TaskRx's rules for the desktop Companion: a port of the phone's :core, held to its golden fixtures (ADR 0017)."

[dependencies]
# The zone database is bundled, so a rule answers the same on every machine and the gate
# does not depend on the system's tzdata.
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v5"] }
