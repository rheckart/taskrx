[package]
name = "taskrx-desktop-service"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "The desktop Companion's toolkit-free side: sign-in, the keyring, the Convex connection and the screen state (ADR 0016, 0017)."

[dependencies]
taskrx-desktop-core = { path = "../taskrx-desktop-core" }
anyhow = "1"
base64 = "0.22"
convex = "0.10.4"
futures = "0.3"
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }
# The keyring is the Secret Service (gnome-keyring, KeePassXC). No async runtime feature: the
# store is called from blocking code, never from inside a tokio task.
keyring-core = "1.0.1"
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
url = "2"
