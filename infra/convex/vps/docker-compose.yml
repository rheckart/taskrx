# TaskRx's Convex backend on the shared VPS, behind the Traefik already running there.
# Lives at /docker/taskrx on the box, beside /docker/caballus and /docker/traefik.
#
# No Postgres of its own: it uses the one in the caballus stack, as its own role and
# database (`taskrx`), reached over that stack's network. See the README, "The VPS".
name: taskrx

services:
  backend:
    # Pinned by digest, the same build as the local one. Watchtower on this box updates
    # every container daily, and a backend that upgrades itself under a live app is not
    # something to find out about from a phone.
    image: ghcr.io/get-convex/convex-backend@sha256:d715e9ec088784407ca4ba2d3db592702cd328d02c76cdca3852c0018f2a76b4
    restart: unless-stopped
    # Hardening (2026-10-26 audit): no privilege escalation, only the
    # capabilities this service needs, and a ceiling on memory and processes.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    pids_limit: 256
    # No `ports:`. ufw is off on this box, so a published port is on the internet.
    # Traefik runs with host networking and reaches the container by its address.
    environment:
      INSTANCE_NAME: taskrx
      INSTANCE_SECRET: ${INSTANCE_SECRET:?set in .env}
      # No database name and no query params: Convex picks the database from INSTANCE_NAME.
      POSTGRES_URL: postgresql://taskrx:${TASKRX_DB_PASSWORD:?set in .env}@postgres:5432
      DO_NOT_REQUIRE_SSL: "1"
      CONVEX_CLOUD_ORIGIN: https://taskrx.caballus.tech
      # The app has no HTTP actions, so this one has no public route.
      CONVEX_SITE_ORIGIN: https://taskrx.caballus.tech/http
      DOCUMENT_RETENTION_DELAY: "172800"
      DISABLE_BEACON: "true"
    volumes:
      - data:/convex/data
    healthcheck:
      test: curl -f http://localhost:3210/version
      interval: 10s
      start_period: 20s
    networks:
      # default: Traefik reaches the backend here. postgres: the database.
      - default
      - postgres
    labels:
      - com.centurylinklabs.watchtower.enable=false
      - traefik.enable=true
      - traefik.docker.network=taskrx_default
      - traefik.http.routers.taskrx.rule=Host(`taskrx.caballus.tech`)
      - traefik.http.routers.taskrx.entrypoints=websecure
      - traefik.http.routers.taskrx.tls.certresolver=letsencrypt
      - traefik.http.services.taskrx.loadbalancer.server.port=3210

networks:
  default:
  postgres:
    external: true
    # This stack's internal network to the caballus stack's Postgres, where it
    # answers to "postgres". Internal: no other stack, and no internet, on it.
    name: pg-taskrx

volumes:
  data:
